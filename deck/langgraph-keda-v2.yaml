          - {kind: text, x: 400, y: 290, w: 355, h: 64, text: "KEDA → HPA → Deployment\n합계 6 ÷ 목표 2 = 희망 Pod 3", size: 14}
          - {kind: arrow, x: 610, y: 285, x2: 610, y2: 230, line: "1F4E79", line_w: 2}
          - {kind: text, x: 850, y: 51, w: 320, h: 32, text: "AKS 외부 · Azure 관리형 서비스", size: 15, bold: true, color: "1F4E79", align: left}
          - {kind: line, x: 850, y: 95, x2: 1183, y2: 95, line: "FF8C00", line_w: 2}
          - {kind: round, x: 850, y: 145, w: 333, h: 85, fill: "EAF6EC", line: "2E7D32", radius: 6}
          - {kind: text, x: 860, y: 150, w: 313, h: 72, text: "Microsoft Foundry\ngpt-4.1-nano · T6에서만 호출", size: 15}
          - {kind: arrow, x: 765, y: 185, x2: 850, y2: 185, line: "2E7D32", line_w: 2}
          - {kind: round, x: 850, y: 285, w: 333, h: 75, fill: "F3EEFB", line: "7B61FF", radius: 6}
          - {kind: text, x: 860, y: 290, w: 313, h: 64, text: "Managed Prometheus\nPodMonitor로 Pod별 수집", size: 14}
          - {kind: arrow, x: 765, y: 223, x2: 850, y2: 290, line: "7B61FF", line_w: 2}
          - {kind: arrow, x: 850, y: 322, x2: 765, y2: 322, line: "1F4E79", line_w: 2}
          - {kind: round, x: 8, y: 417, w: 1175, h: 73, fill: "F3F4F6", line: "A6A6A6", radius: 5}
          - {kind: text, x: 25, y: 425, w: 1135, h: 55, text: "T1~T5  제어 가능한 SSE로 Pod 확장·축소 검증       T6  실제 모델 응답 중인 Pod를 지정 삭제해 종료 경로 검증", size: 14, align: left}
    notes: |
      이번 검증의 질문은 두 가지입니다. 스트림이 열려 있다는 사실을 실제 Pod 수로 연결할 수 있는지, 그리고 답변 중인 Pod를 종료할 때 같은 클라이언트가 마지막 이벤트까지 받을 수 있는지입니다. 왼쪽의 부하 클라이언트는 브라우저 대신 Pod 주소에 직접 연결합니다. 파란 경계 안이 AKS이고 오른쪽의 관리형 서비스 두 개는 그 밖에 있습니다. 모델이 KEDA에 직접 지표를 보내는 구조는 아닙니다. 런타임에서 응답을 계측하고 워크스페이스에 수집한 뒤 KEDA가 조회합니다. 모델 응답 길이와 쿼터가 확장 시험에 영향을 주지 않게 두 경로를 나눈 이유입니다. 다음 장에서는 두 질문의 판정 방식을 살펴보겠습니다.
    source: "k8s/workload.yaml; k8s/scaler.yaml; infra/model.bicep"
  - layout: section
    section_no: "01"
    title: "스트림 검증"
    subtitle: "활성 SSE 계측 · KEDA 확장과 축소 · 응답 중인 Pod의 정상 종료"
    notes: |
      앞에서 본 두 경로를 서로 독립적으로 시험했습니다. 하나는 복제본 수가 바뀌는 경로이고, 다른 하나는 삭제 대상으로 이미 선택된 Pod가 기존 답변을 마무리하는 경로입니다. 두 경로를 섞지 않고 무엇을 성공으로 볼지 먼저 짚겠습니다.
  - layout: content
    title: "검증 매트릭스 — 확장 5건과 응답 중 종료 1건"
    blocks:
      - type: table
        box: [48,110,1184,285]
        header_fill: "0078D4"
        col_widths: [0.8,2.1,4.2,3.8]
        columns: ["ID","대상","수행","통과 기준"]
        rows:
          - ["T1","초기 상태","부하 없이 워크스페이스 조회","실제 0 · 희망 1 · Ready 1"]
          - ["T2","스트림 계측","최초 Pod에 SSE 연결 6개 유지","앱과 워크스페이스가 모두 6"]
          - ["T3","Pod 확장","Pod당 목표를 2로 설정","희망 3 · 실제 Ready 3"]
          - ["T4","신규 Pod","다른 UID의 Pod로 짧은 SSE 요청","해당 Pod에서 Gauge 1 → 0 · done"]
          - ["T5","Pod 축소","6개 응답을 모두 종료","합계 0 · Ready 1 · 노드 2 유지"]
          - ["T6","진행 중 응답","첫 모델 delta 수신 후 해당 Pod 정상 삭제","새 요청 503 · 기존 요청 done"]
      - type: cards
        box: [48,415,1184,144]
        columns: 3
        style: accent-top
        items:
          - {title: "계측 단위", body: "토큰이 아니라 실행 중인 최상위 SSE 스트림 하나를 센다.", color: "0078D4"}
          - {title: "Pod 식별", body: "기존 연결의 이동과 새 Pod의 신규 요청 처리를 구분한다.", color: "0078D4"}
          - {title: "완료 기준", body: "연결이 닫힌 것만으로는 부족하다. 마지막 done 이벤트를 확인한다.", color: "0078D4"}
      - {type: callout, box: [48,582,1184,66], text: "빈 Prometheus 응답은 0이 아니다. 실제 0을 관측하고 HPA가 지표를 읽은 뒤에 부하를 시작했다."}
    notes: |
      먼저 위쪽 다섯 행은 모델 없이 실행합니다. 최초 Pod 하나에서 스트림 여섯 개를 열고 그대로 유지하면 어느 Pod가 부하를 받았는지 분명하게 볼 수 있습니다. 워크스페이스가 여섯을 보고한 뒤 HPA 희망 수가 셋이 되는 것과 실제 셋이 준비되는 것은 별개의 관측입니다. 새 Pod에도 직접 요청해서 일을 받을 수 있음을 확인합니다. 마지막으로 스트림을 닫고 원래 상태가 돌아와야 축소까지 성공입니다. 여섯 번째 행은 질문이 다릅니다. 모델 답변의 첫 텍스트를 받은 Pod를 삭제한 뒤 두 번째 클라이언트가 거절되는 동안 첫 번째 클라이언트는 계속 읽을 수 있어야 해요. 그 결과를 다음 표에서 나란히 보겠습니다.
    source: "scripts/Verify.ps1; scripts/VerifyDrain.ps1"
  - layout: content
    title: "실측 결과 — Ready Pod 1 → 3 → 1, 기존 답변 완료"
    blocks:
      - type: table
        box: [48,110,1184,270]
        header_fill: "0078D4"
        columns: ["시각 (KST)", "활성 SSE", "HPA 희망", "Ready", "관측 결과"]
        rows:
          - ["20:07:46","0","1","1","초기 상태"]
          - ["20:08:32","6","1","1","워크스페이스에 6 반영"]
          - ["20:08:39","6","3","1","희망 수 변경"]
          - ["20:08:46","6","3","3","새 Pod 준비"]
          - ["20:10:04","0","3","3","부하 해제 확인"]
          - ["20:14:55","0","1","1","축소 완료"]
      - type: cards
        box: [48,405,1184,139]
        columns: 2
        style: accent-left
        items:
          - {title: "기존 SSE · 완료", body: "삭제 직전 active=1. 같은 클라이언트가 텍스트 delta 106개와 done을 수신했다.", color: "2E7D32"}
          - {title: "신규 SSE · 503", body: "종료 표시 후 같은 Pod의 새 요청은 거절됐다. 기존 응답 완료 확인까지 62.5초였다.", color: "C62828"}
      - {type: callout, box: [48,570,1184,72], text: "위 표는 확장 시험, 아래 카드는 별도의 지정 삭제 시험이다. 62.5초에는 delta당 0.6초의 시험 지연이 포함된다."}
    notes: |
      이제 실제 값을 보겠습니다. 여섯이 처음 보이고 셋이 준비될 때까지 약 십사 초였습니다. 여기서 시작점은 사용자 요청 시각이 아니라 워크스페이스에서 그 값이 관측된 시각입니다. 영이 처음 보이고 Ready 하나로 돌아오기까지는 약 사 분 오십 초가 걸렸습니다. 이것도 보장 시간이 아니라 이번 표본 간 시간 차이예요. 아래 카드는 같은 타임라인의 다음 행이 아닙니다. 실제 모델을 사용한 별도의 삭제 시험에서 신규 연결이 거절되고 기존 연결이 끝까지 유지된 것을 대조한 결과입니다. 백여섯은 토큰 수가 아니라 텍스트 이벤트의 수입니다. 다음에는 이 동작을 재현하는 데 꼭 필요한 설정만 보겠습니다.
    source: "evidence/sse-cycle.json; evidence/model-drain.json"
  - layout: section
    section_no: "02"
    title: "재현 및 정리"
    subtitle: "Pod당 확장 목표 · 종료 유예 예산 · 확인된 범위와 다음 시험"
    notes: |
      앞의 결과는 스케일링과 종료를 모두 다루지만 두 기능을 설정하는 위치는 다릅니다. KEDA는 몇 개를 유지할지 결정하고, Pod와 서버는 그중 하나가 종료될 때 응답을 어떻게 처리할지 결정합니다. 재현할 때 바꿔서는 안 되는 값을 살펴보겠습니다.
  - layout: content
    title: "재현 설정 — 확장 목표와 종료 유예는 별개"
    blocks:
      - type: code
        box: [48,110,568,197]
        title: "Agent Runtime · SSE 계측 핵심"
        size: 12
        code: |
          with ACTIVE.track_inprogress():
              async for event in graph.astream(
                  inputs, config=config, stream_mode="custom"
              ):
                  yield event
      - type: cards
        box: [640,110,592,197]
        columns: 1
        style: accent-left
        items:
          - {title: "KEDA · Prometheus 트리거", body: "대상 Pod의 Gauge 합계 / AverageValue 목표 2. 복제본은 최소 1 · 최대 4, 수집 주기는 15초다.", color: "0078D4"}
      - type: table
        box: [48,332,1184,203]
        header_fill: "0078D4"
        columns: ["종료 단계", "설정", "동작"]
        rows:
          - ["Pod 삭제 시작","terminationGracePeriodSeconds: 120","전체 종료 예산 시작"]
          - ["preStop","종료 표시 파일 생성 후 sleep 10","신규 요청 503 · 기존 SSE 유지"]
          - ["SIGTERM","Uvicorn graceful shutdown: 최대 105초","진행 중인 응답이 끝나면 먼저 종료"]
      - {type: callout, box: [48,561,1184,78], text: "preStop 10초는 전체 120초에 포함된다. 10 + 105초를 배정해 5초를 남겼으며, 120초를 넘는 답변까지 보장하지 않는다."}
    notes: |
      왼쪽 코드는 핵심 구간만 줄여 적었습니다. 응답 객체를 만들 때가 아니라 그래프에서 이벤트를 소비하는 동안 Gauge를 하나 더합니다. 실제 코드에서는 생성기를 명시적으로 닫아 연결 해제나 예외가 나도 값을 돌려놓습니다. 오른쪽의 둘은 실험을 재현할 목표이지 운영 서버의 물리적 한도는 아닙니다. 아래 표는 삭제가 시작된 뒤의 이야기입니다. 앱이 먼저 종료 중이라고 표시해야 새로운 연결이 그 Pod에 들어오지 않습니다. 십 초 뒤 서버가 종료 신호를 받으면 이미 열린 요청을 기다립니다. 이 과정은 HPA가 축소 결정을 보류하는 시간과는 무관합니다. 마지막으로 운영에 그대로 옮길 수 있는 결론과 그렇지 않은 부분을 구분하겠습니다.
    source: "app/main.py; app/Dockerfile; k8s/workload.yaml; k8s/monitor.yaml; k8s/scaler.yaml"
  - layout: content
    title: "KEDA와 Managed Prometheus 연결 — 수집, 인증, 조회"
    blocks:
      - type: table
        box: [48,112,1184,196]
        header_fill: "0078D4"
        columns: ["단계", "설정 위치", "이 실험에서 연결한 대상"]
        rows:
          - ["① 수집", "AKS 관리형 메트릭 + PodMonitor", "런타임 /metrics → 15초마다 수집 → DCR → Azure Monitor workspace"]
          - ["② 인증", "AKS OIDC + Workload Identity", "kube-system:keda-operator ↔ 사용자 할당 관리 ID"]
          - ["③ 권한", "워크스페이스 범위 Azure RBAC", "관리 ID에 Monitoring Data Reader 부여"]
      - type: code
        box: [48,327,668,218]
        title: "ScaledObject · prometheus 트리거 발췌"
        size: 12
        code: |
          metricType: AverageValue
          authenticationRef: {name: workspace-reader}
          metadata:
            serverAddress: <prometheusQueryEndpoint>
            query: >-
              sum(agent_runs_active{cluster="<AKS 이름>",
              namespace="run-lab",pod=~"agent-runtime-.+"})
            threshold: "2"
            ignoreNullValues: "false"
      - type: cards
        box: [740,327,492,218]
        columns: 1
        style: accent-left
        items:
          - {title: "조회 자격 증명 · workspace-reader", body: "TriggerAuthentication에서 provider를 azure-workload로, identityId를 관리 ID의 클라이언트 ID로 지정합니다. KEDA는 수집 주소가 아니라 워크스페이스의 Prometheus 쿼리 주소를 조회합니다.", color: "0078D4"}
      - {type: callout, box: [48,565,1184,82], text: "연결 확인: 워크스페이스에서 실제 0 조회 → HPA ScalingActive=True → 부하 6에서 희망·Ready 3. 빈 응답은 0이 아니다."}
    notes: |
      앞에서 본 Gauge가 있어도 KEDA가 그 값을 자동으로 발견하지는 않습니다. 수집과 조회를 따로 연결해야 하거든요. 먼저 AKS에서 관리형 메트릭을 켜고 데이터 수집 규칙인 DCR의 목적지를 Azure Monitor workspace로 지정합니다. PodMonitor는 run-lab에서 app 라벨이 agent-runtime인 Pod의 http 포트를 찾아 /metrics를 십오 초마다 읽도록 설정합니다. 여기까지는 값을 저장하는 쪽입니다.
      그럼 누가 그 값을 읽을까요? 앱 Pod가 아니라 KEDA 오퍼레이터입니다. AKS의 KEDA 추가 기능과 OIDC 발급자, Workload Identity를 켭니다. 사용자 할당 관리 ID에 클러스터 발급자와 kube-system의 keda-operator 서비스 계정을 신뢰하는 페더레이션 자격 증명을 만들고, 워크스페이스 범위에서 Monitoring Data Reader 역할을 줍니다. 이 실험의 배포 스크립트는 서비스 계정에 해당 클라이언트 ID를 주석으로 붙이고 오퍼레이터를 재시작합니다.
      이제 왼쪽 설정을 보세요. 꺾쇠 부분은 배포 시 실제 값으로 치환합니다. ScaledObject가 같은 네임스페이스의 workspace-reader를 참조하면 KEDA가 그 ID로 쿼리 주소에 접근합니다. 이때 다른 클러스터나 앱이 섞이지 않도록 라벨로 거른 뒤 합산합니다. 합계가 여섯이고 목표가 Pod당 둘이면 희망 복제본은 셋이죠. 빈 시계열은 유휴 상태의 영이 아닙니다. 데이터가 없다면 수집 경로를, 조회가 거절되면 오퍼레이터의 자격 증명과 역할을 먼저 확인하세요. 마지막으로 이번 검증 범위와 리소스 상태를 정리하겠습니다.
    source: "infra/main.bicep; k8s/monitor.yaml; k8s/scaler.yaml; scripts/Deploy.ps1; scripts/Common.ps1; https://learn.microsoft.com/azure/azure-monitor/containers/integrate-keda"
