          - {kind: round, x: 22, y: 89, w: 767, h: 161, fill: "F7FAFF", line: "5578FF", dash: true, radius: 5}
          - {kind: text, x: 36, y: 94, w: 400, h: 25, text: "run-lab 네임스페이스", size: 12, bold: true, color: "1F4E79", align: left}
          - {kind: round, x: 37, y: 145, w: 230, h: 85, fill: "E6F4F1", line: "008577", radius: 6}
