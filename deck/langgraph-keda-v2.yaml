deck:
  title: "LangGraph SSE · KEDA 검증 — 설계와 결과"
  level: L300
  mode: fit
  target_slides: 8
  theme: light
  brand: none
  slide_numbers: true
  topic_marker: false
  coverage: ["스트림 검증", "재현 및 정리"]
  footer: "LangGraph SSE · KEDA PoC · 설계와 결과 v2 · 2026-11-20 · Korea Central · 기능 검증용"
slides:
  - layout: content
    title: "검증 샘플 구성 — 스트림 수로 AKS Pod 확장"
    title_size: 26
    archetype: architecture
    blocks:
      - type: shapes
        box: [40,110,1200,535]
        items:
