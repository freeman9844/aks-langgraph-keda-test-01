          - {kind: arrow, x: 268, y: 185, x2: 390, y2: 185, line: "008577", line_w: 2}
          - {kind: round, x: 390, y: 145, w: 375, h: 85, fill: "EEF3FB", line: "1F4E79", radius: 6}
