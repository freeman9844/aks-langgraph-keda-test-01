apiVersion: v1
kind: Namespace
metadata:
  name: run-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: run-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent-runtime}
  template:
    metadata:
      labels: {app: agent-runtime}
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      containers:
        - name: runtime
          image: __IMAGE__
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-ec", "touch /tmp/runlab-draining; sleep 10"]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /ready, port: http}
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: load-client, namespace: run-lab}
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: __IMAGE__
      command: [python, -c, "import time; time.sleep(86400)"]
